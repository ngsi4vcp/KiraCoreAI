name: Проверка KiraCoreAI — Android

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: ["platform/android"]
  pull_request:
    branches: ["main"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Core + Android
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Подготовить Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить Android SDK 37
        shell: bash
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Проверить UTF-8
        run: python tests/utf8_smoke.py

      - name: Установить Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Core tests
        run: python -m unittest discover -s tests -v

      - name: Android unit tests и debug APK
        run: gradle --no-daemon :android:app:testDebugUnitTest :android:app:assembleDebug

      - name: Проверить APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Публиковать debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kira-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Физические Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon :android:app:connectedDebugAndroidTest

      - name: Chaquopy packaging smoke
        run: python tests/android_apk_packaging_smoke.py android/app/build/outputs/apk/debug/app-debug.apk

      - name: Security smoke
        run: python tests/security_smoke.py

      - name: Публиковать debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kira-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
