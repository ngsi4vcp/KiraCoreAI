name: Проверка KiraCoreAI — Linux

on:
  push:
    branches: ["platform/linux"]
  pull_request:
    branches: ["main"]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Core + Linux Host
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить проект
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Core + host tests
        run: python -m unittest discover -s tests -v

      - name: UTF-8
        run: python tests/utf8_smoke.py

      - name: Security smoke
        run: python tests/security_smoke.py

      - name: Entrypoint
        run: |
          output="$(python START.py --version)"
          echo "$output"
          test "$output" = "Кира:Ядро | версия 0.1.0-alpha.1"
