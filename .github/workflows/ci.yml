name: Проверка KiraCoreAI — Core

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Общий Core
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Проверить UTF-8
        shell: bash
        run: python tests/utf8_smoke.py

      - name: Установить Core
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Запустить Core tests
        shell: bash
        run: python -m unittest discover -s tests -v

      - name: Security smoke
        shell: bash
        run: python tests/security_smoke.py
