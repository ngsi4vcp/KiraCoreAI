name: Проверка KiraCoreAI

on:
  push:
    branches: ["main", "android/alpha-parity"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверить импорт пакета
        shell: bash
        run: |
          python -m compileall -q src tests

      - name: Установить проект
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Запустить тесты
        shell: bash
        run: |
          python -m unittest discover -s tests -v

  package-smoke:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Установить проект и PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Проверить сборку
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name START START.py
          if [ "${{ matrix.platform }}" = "windows" ]; then
            test -f dist/START.exe
            output=$(dist/START.exe --version)
          else
            test -f dist/START
            test -x dist/START
            output=$(./dist/START --version)
          fi
          echo "$output"
          test "$output" = "Кира:Ядро | версия 0.1.0-alpha.1"
