name: Проверка KiraCoreAI — Windows 11

on:
  push:
    branches: ["platform/windows-11"]
  pull_request:
    branches: ["main"]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Core + Windows Host
    runs-on: windows-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить проект
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Core + host tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: UTF-8
        shell: pwsh
        run: python tests/utf8_smoke.py

      - name: Security smoke
        shell: pwsh
        run: python tests/security_smoke.py

      - name: Entrypoint
        shell: pwsh
        run: |
          $output = python START.py --version
          Write-Output $output
          if ($output -ne "Кира:Ядро | версия 0.1.0-alpha.1") { exit 1 }
