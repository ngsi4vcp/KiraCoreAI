name: Проверка KiraCoreAI

on:
  push:
    branches: ["main", "android/alpha-parity"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Проверить импорт пакета
        shell: bash
        run: |
          python -m compileall -q src tests

      - name: Установить проект
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Запустить тесты
        shell: bash
        run: |
          python -m unittest discover -s tests -v

      - name: Проверить Android security smoke
        shell: bash
        run: |
          python tests/security_smoke.py

  package-smoke:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Установить проект и PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Проверить сборку
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name START START.py
          if [ "${{ matrix.platform }}" = "windows" ]; then
            test -f dist/START.exe
            output=$(dist/START.exe --version)
          else
            test -f dist/START
            test -x dist/START
            output=$(./dist/START --version)
          fi
          echo "$output"
          test "$output" = "Кира:Ядро | версия 0.1.0-alpha.1"


  android-a0:
    name: Android A0 smoke
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Подготовить Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v4

      - name: Установить Android SDK 37
        shell: bash
        run: |
          CMDLINE_TOOLS_BIN="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -mindepth 2 -maxdepth 2 -type f -name sdkmanager -printf '%T@ %h\\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -x "$CMDLINE_TOOLS_BIN/sdkmanager"
          "$CMDLINE_TOOLS_BIN/sdkmanager" --channel=3 "platforms;android-37" "build-tools;36.0.0" "platform-tools"

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Запустить Android unit tests и собрать debug APK
        shell: bash
        run: |
          gradle --no-daemon :android:app:testDebugUnitTest :android:app:assembleDebug

      - name: Проверить APK
        shell: bash
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Повторить security smoke по исходникам и build output
        shell: bash
        run: |
          python tests/security_smoke.py
