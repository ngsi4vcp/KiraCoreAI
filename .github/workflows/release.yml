name: Сборка Alpha-релиза

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  mark-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7
      - name: Пометить выпуск как предварительный
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v0.1.0-alpha.1 --prerelease --title "KiraCoreAI v0.1.0-alpha.1"
