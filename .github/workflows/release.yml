name: Сборка Alpha-релиза

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Установить проект и PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Собрать исполняемый файл
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --name START START.py

      - name: Проверить запуск бинарника
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            output=$(dist/START.exe --version)
          else
            output=$(./dist/START --version)
          fi
          echo "$output"
          test "$output" = "Кира:Ядро | версия 0.1.0-alpha.1"

      - name: Собрать release-архив
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python scripts/package_release.py --platform windows --binary dist/START.exe
          else
            python scripts/package_release.py --platform linux --binary dist/START
          fi

      - name: Сохранить release-артефакт
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Скачать release-артефакты
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Опубликовать GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --generate-notes \
            --title "KiraCoreAI ${GITHUB_REF_NAME}"
