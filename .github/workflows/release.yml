name: Linux Release

on:
  push:
    tags:
      - "linux-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить проект и PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Собрать
        run: python -m PyInstaller --clean --noconfirm --onefile --name START START.py

      - name: Проверить запуск
        run: |
          output="$(./dist/START --version)"
          echo "$output"
          test "$output" = "Кира:Ядро | версия 0.1.0-alpha.1"

      - name: Упаковать
        run: python scripts/package_release.py --platform linux --binary dist/START

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$(find release -type f -name '*.tar.gz' | head -n 1)"
          test -n "$asset"
          gh release create "$GITHUB_REF_NAME" "$asset" --target "$GITHUB_SHA" --prerelease --title "KiraCoreAI $GITHUB_REF_NAME" --notes "Linux x64 release."
