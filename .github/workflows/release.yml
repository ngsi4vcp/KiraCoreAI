name: Windows 11 Release

on:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить проект и PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Собрать
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm --onefile --name START START.py

      - name: Проверить запуск
        shell: pwsh
        run: |
          $output = & .distSTART.exe --version
          Write-Output $output
          if ($output -ne "Кира:Ядро | версия 0.1.0-alpha.1") { exit 1 }

      - name: Упаковать
        shell: pwsh
        run: python scripts/package_release.py --platform windows --binary dist/START.exe

      - name: Опубликовать
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = Get-ChildItem -Path release -Filter *.zip | Select-Object -First 1
          gh release create "$env:GITHUB_REF_NAME" "$($asset.FullName)" --target "$env:GITHUB_SHA" --prerelease --title "KiraCoreAI $env:GITHUB_REF_NAME" --notes "Windows 11 release."
